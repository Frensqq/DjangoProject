{% extends 'games/base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-card-header">
            <h3>🔑 Вход в систему</h3>
        </div>
        <div class="form-card-body">
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-danger" style="margin-bottom: 20px;">
                        <strong>Ошибка!</strong> Неправильное имя пользователя или пароль.
                    </div>
                {% endif %}
                
                <div class="form-group">
                    <label for="id_username">Имя пользователя:</label>
                    <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="id_password">Пароль:</label>
                    <input type="password" name="password" id="id_password" class="form-control" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">🚪 Войти</button>
                    <a href="{% url 'games:register' %}" class="btn btn-secondary">Нет аккаунта? Зарегистрироваться</a>
                </div>
                
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
</div>
{% endblock %}
