{% extends 'games/base.html' %}

{% block title %}Тетрис{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="form-card-header">
            <h3>Тетрис</h3>
        </div>
       <div class="form-card-body" style="text-align: center;">
            <canvas id="game" width="320" height="640" ></canvas>
            <div style="margin-top: 20px;">
                <button id="startStopBtn" class="btn btn-success">Начать игру</button>
                <p style="margin-top: 10px; color: var(--retro-beige);"></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
